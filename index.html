function formatDate(dateStr) {
    const d = new Date(dateStr);
    return d.toLocaleDateString('it-IT', { day: '2-digit', month: 'long', year: 'numeric' });
}

function formatTime(timeStr) {
    return timeStr || '—';
}

function getPositionClass(pos) {
    if (pos === 1) return 'pos-1';
    if (pos === 2) return 'pos-2';
    if (pos === 3) return 'pos-3';
    return '';
}

function getStatusClass(status) {
    if (status === 'completed') return 'race-status completed';
    if (status === 'live') return 'race-status live';
    return 'race-status upcoming';
}

function getStatusLabel(status) {
    if (status === 'completed') return 'Concluso';
    if (status === 'live') return 'In corso';
    return 'In programma';
}

function getTeamColor(teamId) {
    const team = state.teams.find(t => t.id === teamId);
    return team ? team.color : '#666';
}

function getTeamName(teamId) {
    const team = state.teams.find(t => t.id === teamId);
    return team ? team.name : '—';
}

function getDriverName(driverId) {
    const d = state.drivers.find(dr => dr.id === driverId);
    return d ? `${d.name} ${d.surname}` : '—';
}

function getDriverAvatar(driverId) {
    const d = state.drivers.find(dr => dr.id === driverId);
    return d ? d.avatar : 'https://picsum.photos/48?random=999';
}

function getDriverTeam(driverId) {
    const d = state.drivers.find(dr => dr.id === driverId);
    return d ? d.teamId : null;
}

function calculateDriverStandings() {
    const standings = [];
    const scoring = DEFAULT_SCORING;
    const completedRaces = state.races.filter(r => r.status === 'completed');
    
    state.drivers.forEach(driver => {
        const results = state.raceResults.filter(r => r.driverId === driver.id);
        let points = 0;
        let wins = 0;
        let podiums = 0;
        let poles = 0;
        let fastestLaps = 0;
        let racesCount = 0;
        let retirements = 0;
        let dnfs = 0;
        
        results.forEach(r => {
            if (r.position && r.position <= 20) {
                const posPoints = scoring.points[r.position - 1] || 0;
                points += posPoints;
                if (r.poleBonus) points += scoring.poleBonus;
                if (r.fastestLap) points += scoring.fastestLapBonus;
                racesCount++;
                if (r.position === 1) wins++;
                if (r.position <= 3) podiums++;
                if (r.pole) poles++;
                if (r.fastestLap) fastestLaps++;
            }
            if (r.dnf || r.retired) {
                retirements++;
                dnfs++;
            }
            if (r.penalty) points -= r.penalty;
        });
        
        standings.push({
            driverId: driver.id,
            name: `${driver.name} ${driver.surname}`,
            teamId: driver.teamId,
            teamName: getTeamName(driver.teamId),
            points,
            wins,
            podiums,
            poles,
            fastestLaps,
            races: racesCount,
            retirements,
            dnfs,
            avatar: driver.avatar,
            color: driver.color,
            number: driver.number
        });
    });
    
    standings.sort((a, b) => b.points - a.points);
    let maxPoints = standings.length > 0 ? standings[0].points : 0;
    standings.forEach((s, i) => {
        s.position = i + 1;
        s.gap = maxPoints - s.points;
    });
    
    return standings;
}

function calculateConstructorStandings() {
    const standings = [];
    
    state.teams.forEach(team => {
        const teamDrivers = state.drivers.filter(d => d.teamId === team.id);
        const driverStandings = calculateDriverStandings();
        const teamResults = driverStandings.filter(d => d.teamId === team.id);
        
        let points = 0;
        let wins = 0;
        let podiums = 0;
        
        teamResults.forEach(d => {
            points += d.points;
            wins += d.wins;
            podiums += d.podiums;
        });
        
        standings.push({
            teamId: team.id,
            name: team.name,
            color: team.color,
            logo: team.logo,
            drivers: teamDrivers.map(d => `${d.name} ${d.surname}`).join(', '),
            points,
            wins,
            podiums,
            driverCount: teamDrivers.length
        });
    });
    
    standings.sort((a, b) => b.points - a.points);
    standings.forEach((s, i) => s.position = i + 1);
    
    return standings;
}

function showToast(message, type = 'success') {
    const toast = document.getElementById('toast');
    const icon = document.getElementById('toast-icon');
    const msg = document.getElementById('toast-message');
    
    msg.textContent = message;
    toast.className = `toast ${type}`;
    icon.className = type === 'success' ? 'fas fa-check-circle text-green-400 text-lg' : 'fas fa-exclamation-circle text-red-400 text-lg';
    
    toast.classList.add('show');
    clearTimeout(toast._timeout);
    toast._timeout = setTimeout(() => toast.classList.remove('show'), 3500);
}

function navigate(page, params = {}) {
    closeSidebar();
    
    document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
    document.querySelectorAll('.sidebar-link').forEach(l => l.classList.remove('active'));
    
    const targetPage = document.getElementById(`page-${page}`);
    if (targetPage) {
        targetPage.classList.add('active');
        document.querySelector(`.sidebar-link[data-page="${page}"]`)?.classList.add('active');
    }
    
    state.currentPage = page;
    
    // Render page
    switch(page) {
        case 'home': renderHome(); break;
        case 'drivers-standings': renderDriversStandings(); break;
        case 'constructors-standings': renderConstructorsStandings(); break;
        case 'calendar': renderCalendar(); break;
        case 'grand-prix': renderGrandPrix(params.id); break;
        case 'drivers': renderDrivers(); break;
        case 'teams': renderTeams(); break;
        case 'statistics': renderStatistics(); break;
        case 'records': renderRecords(); break;
        case 'hall-of-fame': renderHallOfFame(); break;
        case 'regulations': renderRegulations(); break;
        case 'news': renderNews(); break;
        case 'login': renderLogin(); break;
        case 'profile': renderProfile(); break;
        case 'admin': renderAdmin(); break;
    }
    
    document.title = `SRT Racing | ${targetPage?.getAttribute('data-title') || page}`;
}

// --- COUNTDOWN ---
let countdownInterval = null;

function startCountdown(targetDateStr) {
    if (countdownInterval) clearInterval(countdownInterval);
    
    const target = new Date(targetDateStr).getTime();
    
    function update() {
        const now = new Date().getTime();
        const diff = target - now;
        
        if (diff <= 0) {
            document.getElementById('countdown-days').textContent = '0';
            document.getElementById('countdown-hours').textContent = '0';
            document.getElementById('countdown-minutes').textContent = '0';
            document.getElementById('countdown-seconds').textContent = '0';
            if (countdownInterval) clearInterval(countdownInterval);
            return;
        }
        
        const days = Math.floor(diff / (1000 * 60 * 60 * 24));
        const hours = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
        const minutes = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
        const seconds = Math.floor((diff % (1000 * 60)) / 1000);
        
        document.getElementById('countdown-days').textContent = days;
        document.getElementById('countdown-hours').textContent = hours.toString().padStart(2, '0');
        document.getElementById('countdown-minutes').textContent = minutes.toString().padStart(2, '0');
        document.getElementById('countdown-seconds').textContent = seconds.toString().padStart(2, '0');
    }
    
    update();
    countdownInterval = setInterval(update, 1000);
}

function initCharts(standings, constructorStandings) {
    // Destroy existing charts
    Object.values(charts).forEach(c => { if (c) c.destroy(); });
    charts = {};
    
    const colors = standings.map(d => d.color || '#e10600');
    const labels = standings.map(d => d.name);
    const points = standings.map(d => d.points);
    const wins = standings.map(d => d.wins);
    const podiums = standings.map(d => d.podiums);
    
    // Points Chart
    const ctx1 = document.getElementById('points-chart')?.getContext('2d');
    if (ctx1) {
        charts.points = new Chart(ctx1, {
            type: 'bar',
            data: {
                labels,
                datasets: [{
                    label: 'Punti',
                    data: points,
                    backgroundColor: colors.map(c => c + '80'),
                    borderColor: colors,

let signupMode = false;
function toggleSignupMode() {
    signupMode = !signupMode;
    document.getElementById('signup-name-wrap').style.display = signupMode ? 'block' : 'none';
    document.getElementById('auth-main-btn').innerHTML = signupMode
        ? '<i class="fas fa-user-plus mr-2"></i> Registrati'
        : '<i class="fas fa-sign-in-alt mr-2"></i> Accedi';
    document.getElementById('auth-main-btn').setAttribute('onclick', signupMode ? 'handleSignup()' : 'handleLogin()');
    document.getElementById('auth-mode-btn').textContent = signupMode ? 'Hai già un account? Accedi' : 'Crea un account';
}

async function applySupabaseSession(session) {
    if (!session?.user) {
        state.currentUser = null;
        state.currentRole = 'guest';
        updateUIForAuth();
        return;
    }
    await supabase.rpc('bootstrap_first_admin');
    const { data: profile, error } = await supabase.from('profiles').select('*').eq('id', session.user.id).single();
    if (error) console.warn(error);
    state.currentUser = {
        id: session.user.id,
        name: profile?.display_name || session.user.email?.split('@')[0] || 'Utente',
        email: session.user.email,
        role: profile?.role || 'driver',
        driverId: profile?.driver_id || null
    };
    state.currentRole = state.currentUser.role;
    updateUIForAuth();
}

async function handleSignup() {
    if (!supabase) return showToast('Supabase non disponibile.', 'error');
    const email = document.getElementById('login-email')?.value?.trim();
    const password = document.getElementById('login-password')?.value;
    const displayName = document.getElementById('signup-name')?.value?.trim();
    if (!email || !password || !displayName) return showToast('Compila nome, email e password.', 'error');
    const { data, error } = await supabase.auth.signUp({ email, password, options: { data: { display_name: displayName } } });
    if (error) return showToast(error.message, 'error');
    if (data.session) {
        await applySupabaseSession(data.session);
        showToast('Account creato con successo.', 'success');
        navigate(state.currentRole === 'admin' ? 'admin' : 'profile');
    } else {
        showToast('Account creato. Controlla la tua email per confermare l’accesso.', 'success');
    }
}

async function handleLogin() {
    if (!supabase) return showToast('Supabase non disponibile.', 'error');
    const email = document.getElementById('login-email')?.value?.trim();
    const password = document.getElementById('login-password')?.value;
    if (!email || !password) return showToast('Inserisci email e password.', 'error');
    const { data, error } = await supabase.auth.signInWithPassword({ email, password });
    if (error) return showToast('Accesso non riuscito: ' + error.message, 'error');
    await applySupabaseSession(data.session);
    showToast('Accesso effettuato.', 'success');
    navigate(state.currentRole === 'admin' ? 'admin' : 'profile');
}

function handleGuestLogin() {
    state.currentUser = { id: null, name: 'Ospite', role: 'guest' };
    state.currentRole = 'guest';
    updateUIForAuth();
    showToast('Accesso come ospite.', 'success');
    navigate('home');
}

async function handleLogout() {
    if (supabase) await supabase.auth.signOut();
    state.currentUser = null;
    state.currentRole = 'guest';
    updateUIForAuth();
    showToast('Logout effettuato.', 'success');
    navigate('home');
}

function updateUIForAuth() {
    const isLoggedIn = state.currentUser && state.currentRole !== 'guest';
    const isAdmin = state.currentRole === 'admin';
    const isDriver = state.currentRole === 'driver';
    
    document.getElementById('login-link').style.display = isLoggedIn ? 'none' : 'flex';
    document.getElementById('profile-link').style.display = isLoggedIn ? 'flex' : 'none';
    document.getElementById('admin-link').style.display = isAdmin ? 'flex' : 'none';
    document.getElementById('logout-btn').style.display = isLoggedIn ? 'flex' : 'none';
    
    const headerUser = document.getElementById('header-user');
    if (state.currentUser) {
        headerUser.textContent = state.currentUser.name;
    } else {
        headerUser.textContent = 'Ospite';
    }
    
    const roleBadge = document.getElementById('header-role-badge');
    if (isAdmin) {
        roleBadge.innerHTML = '<span class="px-2 py-0.5 rounded-full bg-red-500/15 text-red-400 text-xs font-medium"><i class="fas fa-crown mr-1"></i>Admin</span>';
    } else if (isDriver) {
        roleBadge.innerHTML = '<span class="px-2 py-0.5 rounded-full bg-blue-500/15 text-blue-400 text-xs font-medium"><i class="fas fa-helmet-safety mr-1"></i>Pilota</span>';

        roleBadge.innerHTML = '<span class="px-2 py-0.5 rounded-full bg-gray-500/15 text-gray-400 text-xs font-medium"><i class="fas fa-user mr-1"></i>Ospite</span>';
    }
}

function saveProfile() {
    const name = document.getElementById('profile-name')?.value;
    const surname = document.getElementById('profile-surname')?.value;
    const number = document.getElementById('profile-number')?.value;
    const platform = document.getElementById('profile-platform')?.value;
    const nationality = document.getElementById('profile-nationality')?.value;
    const teamId = parseInt(document.getElementById('profile-team')?.value);
    
    const user = state.currentUser;
    if (!user || !user.driverId) return;
    
    const driverIndex = state.drivers.findIndex(d => d.id === user.driverId);
    if (driverIndex >= 0) {
        state.drivers[driverIndex] = {
            ...state.drivers[driverIndex],
            name: name || state.drivers[driverIndex].name,
            surname: surname || state.drivers[driverIndex].surname,
            number: parseInt(number) || state.drivers[driverIndex].number,
            platform: platform || state.drivers[driverIndex].platform,
            nationality: nationality || state.drivers[driverIndex].nationality,
            teamId: teamId || state.drivers[driverIndex].teamId
        };
        showToast('Profilo aggiornato con successo!', 'success');
    }
}

function handleAvatarUpload(event) {
    const file = event.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = function(e) {
        const avatar = document.getElementById('profile-avatar');
        if (avatar) avatar.src = e.target.result;
        const user = state.currentUser;
        if (user && user.driverId) {
            const driverIndex = state.drivers.findIndex(d => d.id === user.driverId);
            if (driverIndex >= 0) {
                state.drivers[driverIndex].avatar = e.target.result;
                showToast('Avatar aggiornato!', 'success');
            }
        }
    };
    reader.readAsDataURL(file);
}

function saveResults(raceId) {
    const inputs = document.querySelectorAll('[data-driver]');
    const results = [];
    let hasData = false;
    
    inputs.forEach(input => {
        const driverId = parseInt(input.dataset.driver);
        const field = input.dataset.field;
        if (input.type === 'checkbox') {
            if (!results.find(r => r.driverId === driverId)) {
                results.push({ driverId, raceId, position: null, pole: false, fastestLap: false, dnf: false, penalty: 0 });
            }
            const result = results.find(r => r.driverId === driverId);
            result[field] = input.checked;
            if (input.checked) hasData = true;
        } else if (input.type === 'number') {
            const val = input.value ? parseInt(input.value) : null;
            if (!results.find(r => r.driverId === driverId)) {
                results.push({ driverId, raceId, position: null, pole: false, fastestLap: false, dnf: false, penalty: 0 });
            }
            const result = results.find(r => r.driverId === driverId);
            result[field] = val;
            if (val !== null) hasData = true;
        }
    });
    
    if (!hasData) {
        showToast('Inserisci almeno un risultato.', 'error');
        return;
    }
    
    // Remove existing results for this race
    state.raceResults = state.raceResults.filter(r => r.raceId !== raceId);
    
    // Add new results
    results.forEach(r => {
        state.raceResults.push(r);
    });
    
    // Auto-update race status
    const race = state.races.find(r => r.id === raceId);
    if (race) {
        race.status = 'completed';
    }
    
    closeModal();
    showToast('Risultati salvati! Classifiche e statistiche aggiornate.', 'success');
    renderGrandPrix(raceId);
}

function exportCSV(type) {
    let data = [];
    let headers = [];
    let filename = '';
    
    if (type === 'drivers') {
        const standings = calculateDriverStandings();
        headers = ['Pos', 'Pilota', 'Scuderia', 'Punti', 'Vittorie', 'Podi', 'Pole', 'GV', 'Gare', 'Ritiri', 'Distacco'];
        data = standings.map(d => [d.position, d.name, d.teamName, d.points, d.wins, d.podiums, d.poles, d.fastestLaps, d.races, d.retirements, d.gap]);
        filename = 'classifica_piloti.csv';
    } else if (type === 'constructors') {
        const standings = calculateConstructorStandings();
        headers = ['Pos', 'Scuderia', 'Piloti', 'Punti', 'Vittorie', 'Podi'];
        data = standings.map(s => [s.position, s.name, s.drivers, s.points, s.wins, s.podiums]);
        filename = 'classifica_costruttori.csv';
    } else if (type === 'races') {
        headers = ['Round', 'Nome', 'Circuito', 'Paese', 'Data', 'Ora', 'Stato', 'Giri'];
        data = state.races.map(r => [r.round, r.name, r.circuit, r.country, r.date, r.time, r.status, r.laps]);
        filename = 'calendario_gare.csv';
    }
    
    if (data.length === 0) {
        showToast('Nessun dato da esportare.', 'error');
        return;
    }
    
    const csvContent = [headers.join(','), ...data.map(row => row.join(','))].join('\n');
    const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
    const link = document.createElement('a');
    link.href = URL.createObjectURL(blob);
    link.download = filename;
    link.click();
    URL.revokeObjectURL(link.href);
    showToast('File CSV esportato con successo!', 'success');
}

function handleImport(event) {
    const file = event.target.files[0];
    if (!file) return;
    showToast('Importazione dati non ancora implementata nella demo.', 'info');
}

async function syncWithSupabase() {
    if (!supabase) return;
    try {
        const [driversRes, teamsRes, racesRes, resultsRes, newsRes, seasonsRes] = await Promise.all([
            supabase.from('drivers').select('*').order('id'),
            supabase.from('teams').select('*').order('id'),
            supabase.from('races').select('*').order('round'),
            supabase.from('race_results').select('*').order('id'),
            supabase.from('news').select('*').order('published_at', { ascending: false }),
            supabase.from('seasons').select('*').eq('is_active', true).limit(1)
        ]);
        if (teamsRes.data?.length) state.teams = teamsRes.data.map(t => ({...t}));
        if (driversRes.data?.length) state.drivers = driversRes.data.map(d => ({
            ...d, teamId: d.team_id, platform: d.platform || 'Crossplay'
        }));
        if (racesRes.data?.length) state.races = racesRes.data.map(r => ({
            ...r, seasonId: r.season_id, date: r.race_date, time: r.race_time
        }));
        if (resultsRes.data?.length) state.raceResults = resultsRes.data.map(r => ({
            ...r, raceId: r.race_id, driverId: r.driver_id,
            gridPosition: r.grid_position, fastestLap: r.fastest_lap,
            penaltySeconds: r.penalty_seconds
        }));
        if (newsRes.data?.length) state.news = newsRes.data.map(n => ({
            ...n, date: n.published_at?.slice(0,10)
        }));
        if (seasonsRes.data?.[0]) state.season = {
            id: seasonsRes.data[0].id, name: seasonsRes.data[0].name,
            year: seasonsRes.data[0].year, isActive: seasonsRes.data[0].is_active
        };
        renderHome();
        console.log('✅ Dati sincronizzati da Supabase');
    } catch (err) {
        console.warn('⚠️ Sincronizzazione Supabase non riuscita:', err);
    }
}

async function initializeSupabase() {
    if (!supabase) return;
    await syncWithSupabase();
    const { data: { session } } = await supabase.auth.getSession();
    await applySupabaseSession(session);
    supabase.auth.onAuthStateChange(async (_event, newSession) => {
        await applySupabaseSession(newSession);
    });
}
